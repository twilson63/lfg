name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: Validate skill metadata and repository invariants
        run: python3 scripts/validate_skill.py
      - name: Validate PR slice planning invariants
        run: python3 scripts/validate_pr_slices.py
      - name: Unit tests (automated pr-review gate)
        run: python3 -m pytest tests/test_pr_slices.py -q
      - name: E2E tests (automated pr-review gate)
        run: python3 -m pytest tests/test_e2e_pr_slices.py -q -m e2e
